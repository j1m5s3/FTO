; Navigation: no navmesh in normal play (the city's generated at play time and nothing in it paths). Bot play
; (-FTOBotPlay, development builds) puts a bounds volume over the city once it's built, and the navmesh is built then,
; on whichever machine is bot-playing.
[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
; (Fine enough that a 1.4 m doorway stays open once the agent's radius is taken off both sides.)
NavMeshResolutionParams[0]=(CellSize=15.0,CellHeight=10.0,AgentMaxStepHeight=35.0)
NavMeshResolutionParams[1]=(CellSize=15.0,CellHeight=10.0,AgentMaxStepHeight=35.0)
NavMeshResolutionParams[2]=(CellSize=15.0,CellHeight=10.0,AgentMaxStepHeight=35.0)

[/Script/NavigationSystem.NavigationSystemV1]
bAllowClientSideNavigation=True
; (One agent: an officer, half height 96; a radius of 30 rather than the capsule's 42 keeps doorways in the navmesh.)
+SupportedAgents=(Name="Officer",AgentRadius=30.0,AgentHeight=192.0,NavDataClass="/Script/NavigationSystem.RecastNavMesh")

