; Navigation: none in normal play. No navigation data is ever created on its own (bAutoCreateNavigationData=False), so
; there's no navmesh and no navigation octree: nothing to build, nothing updated as things move (the smoke test checks).
; Bot play (-FTOBotPlay, development builds) creates the navmesh itself once the city's built, with a bounds volume
; over it, on whichever machine is bot-playing; these settings are what it's built with.
[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
; (An officer, half height 96; a radius of 30 rather than the capsule's 42 keeps doorways in the navmesh.)
AgentRadius=30.0
AgentHeight=192.0
; (Fine enough that a 1.4 m doorway stays open once the agent's radius is taken off both sides.)
NavMeshResolutionParams[0]=(CellSize=15.0,CellHeight=10.0,AgentMaxStepHeight=35.0)
NavMeshResolutionParams[1]=(CellSize=15.0,CellHeight=10.0,AgentMaxStepHeight=35.0)
NavMeshResolutionParams[2]=(CellSize=15.0,CellHeight=10.0,AgentMaxStepHeight=35.0)

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=False
; (A client bot-playing needs a navigation system of its own; without navigation data it does nothing.)
bAllowClientSideNavigation=True

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/FTO.FTOGameMode
GlobalDefaultServerGameMode=/Script/FTO.FTOGameMode


[/Script/Engine.RendererSettings]
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
